<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Pembelian - GlowHijab</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: linear-gradient(135deg, #fff8fa, #fce7ee); 
            color: #444; 
            display: flex; 
            justify-content: center; 
            padding: 20px;
            min-height: 100vh;
        }
        .form-container { 
            max-width: 500px; 
            width: 100%; 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 25px; 
            box-shadow: 0 20px 60px rgba(224, 82, 117, 0.15); 
            border: 1px solid #ffe1e9;
            animation: slideUp 0.6s ease-out;
        }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .back-link { 
            color: #e05275; 
            text-decoration: none; 
            display: inline-block; 
            margin-bottom: 25px; 
            font-weight: 700; 
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .back-link:hover {
            transform: translateX(-5px);
            color: #cc3b5e;
        }
        h2 { 
            font-size: 24px; 
            font-weight: 800; 
            color: #cc3b5e; 
            margin-bottom: 30px; 
            border-bottom: 3px solid #ffe1e9; 
            padding-bottom: 15px;
            letter-spacing: 0.5px;
        }
        .form-group { 
            margin-bottom: 20px; 
            display: flex; 
            flex-direction: column;
        }
        .form-group label { 
            font-size: 14px; 
            font-weight: 700; 
            margin-bottom: 8px; 
            color: #555;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 13px;
        }
        input[type="text"], select, textarea { 
            padding: 12px 15px; 
            font-size: 14px; 
            border: 2px solid #ffccd7; 
            border-radius: 10px; 
            outline: none; 
            background-color: #fff;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', sans-serif;
        }
        input[type="text"]:focus, select:focus, textarea:focus { 
            border-color: #ff7597;
            box-shadow: 0 0 0 3px rgba(255, 117, 151, 0.1);
            background-color: #fffbfc;
        }
        input:disabled { 
            background-color: #fdf0f3; 
            color: #666; 
            font-weight: 700;
            border-color: #ffe1e9;
            cursor: not-allowed;
        }
        textarea { 
            height: 85px;
            resize: vertical;
            font-family: 'Segoe UI', sans-serif;
        }
        hr { 
            border: none; 
            border-top: 2px dashed #ffccd7; 
            margin: 30px 0;
        }
        
        .btn-whatsapp {
            display: block;
            background: linear-gradient(135deg, #25d366, #1ebd58);
            color: white;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 800;
            text-align: center;
            text-decoration: none;
            border-radius: 12px;
            width: 100%;
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.25);
            transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
            border: none;
            cursor: pointer;
            letter-spacing: 0.5px;
        }
        .btn-whatsapp:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(37, 211, 102, 0.35);
            background: linear-gradient(135deg, #2dd573, #1ebd58);
        }
        .btn-whatsapp:active {
            transform: translateY(-1px);
        }
        
        .info-box {
            background: linear-gradient(135deg, #f0f9ff, #e0f4ff);
            border-left: 5px solid #25d366;
            padding: 15px;
            border-radius: 10px;
            margin-top: 25px;
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }
        .info-box strong {
            color: #333;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <!-- Tombol Kembali -->
        <a href="toko.html" class="back-link">← Kembali ke Toko</a>

        <h2>✨ Detail Formulir Pesanan</h2>

        <div class="form-group">
            <label>Hijab Pilihan Anda</label>
            <input type="text" id="hijabPilihan" disabled>
        </div>

        <div class="form-group">
            <label>Harga</label>
            <input type="text" id="hargaHijab" disabled>
        </div>

        <hr>

        <div class="form-group">
            <label>Nama Lengkap</label>
            <input type="text" id="namaLengkap" placeholder="Masukkan nama Anda">
        </div>

        <div class="form-group">
            <label>Pilihan Warna (10 Warna)</label>
            <select id="warnaJilbab">
                <option value="Hitam">⬛ Hitam</option>
                <option value="Putih Bersih">⚪ Putih Bersih</option>
                <option value="Milo/Coksu">🟤 Milo / Cokelat Susu</option>
                <option value="Navy Blue">🔵 Navy Blue</option>
                <option value="Soft Pink">💗 Soft Pink</option>
                <option value="Abu Muda">🩶 Abu Muda / Silver</option>
                <option value="Maroon">🔴 Maroon</option>
                <option value="Sage Green">💚 Sage Green</option>
                <option value="Mocca">🟫 Mocca</option>
                <option value="Khaki">🟡 Khaki</option>
            </select>
        </div>

        <div class="form-group">
            <label>Alamat Pengiriman</label>
            <textarea id="alamatPengiriman" placeholder="Tulis alamat lengkap penerima (Jalan, Kelurahan, Kecamatan, Kabupaten)"></textarea>
        </div>

        <!-- Tombol Pesan WhatsApp -->
        <a href="#" id="tombolWA" class="btn-whatsapp" target="_blank" onclick="validasiSebelumKirim(event)">💬 Pesan via WhatsApp</a>

        <!-- Info Box -->
        <div class="info-box">
            <strong>💡 Tips:</strong><br>
            Pastikan data yang diisi sudah benar sebelum mengirim pesanan. Admin akan membalas dalam waktu kurang dari 2 jam saat jam kerja.
        </div>
    </div>

    <script>
        
        const urlParams = new URLSearchParams(window.location.search);
        const namaProduk = urlParams.get('nama') || 'Pashmina Ceruty Baby Doll';
        const hargaProduk = urlParams.get('harga') || '25000';
        // Ubah nomor WhatsApp di sini ya mbaa, pastiin gaada '+' atau '-' yahh
        const defaultWhatsAppNumber = '6285846622468';

        document.getElementById('hijabPilihan').value = namaProduk;
        document.getElementById('hargaHijab').value = 'Rp ' + new Intl.NumberFormat('id-ID').format(hargaProduk);

        
        function perbaruiLinkWhatsApp() {
            const nama = document.getElementById('namaLengkap').value;
            const warna = document.getElementById('warnaJilbab').value;
            const alamat = document.getElementById('alamatPengiriman').value;
            const nomor = defaultWhatsAppNumber.replace(/\D/g, '');
            
            
            const pesan = `Hai admin GlowHijab, aku mau order koleksi hijab cantiknya. ini detail pesanannya! ˚₊۶ৎ˙⋆ \n\n` +
                          `𖤐.ᐟ *DETAIL PESANAN*:\n` +
                          `• Produk: ${namaProduk}\n` +
                          `• Harga: Rp ${new Intl.NumberFormat('id-ID').format(hargaProduk)}\n` +
                          `------------------------------------\n` +
                          `𖤐.ᐟ *DATA PENERIMA*:\n` +
                          `• Nama Lengkap: ${nama}\n` +
                          `• Pilihan Warna: ${warna}\n` +
                          `• Alamat Kirim: ${alamat}\n\n` +
                          `Mohon segera diproses ya Min. Terima kasih! ‿︵˓ʚ♡ɞ˓︵‿`;

            const linkLengkap = nomor ? `https://wa.me/${nomor}?text=${encodeURIComponent(pesan)}` : '#';
            document.getElementById('tombolWA').href = linkLengkap;
        }

        // Mencegah kiriman jika form masih kosong
        function validasiSebelumKirim(event) {
            const nama = document.getElementById('namaLengkap').value;
            const alamat = document.getElementById('alamatPengiriman').value;

            if (!nama.trim() || !alamat.trim()) {
                event.preventDefault(); 
                alert("Mohon isi Nama Lengkap dan Alamat Pengiriman terlebih dahulu ya Kak!");
            }
        }

        // Jalankan pelacakan ketikan form
        document.getElementById('namaLengkap').addEventListener('input', perbaruiLinkWhatsApp);
        document.getElementById('warnaJilbab').addEventListener('change', perbaruiLinkWhatsApp);
        document.getElementById('alamatPengiriman').addEventListener('input', perbaruiLinkWhatsApp);
        
        perbaruiLinkWhatsApp();
    </script>
</body>
</html>
